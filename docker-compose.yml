version: '3.8'

services:
  # MySQL数据库
  database:
    image: mysql:8.0
    container_name: daily_eat_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: daily_eat_db
      MYSQL_USER: daily_eat_user
      MYSQL_PASSWORD: daily_eat_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - daily_eat_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Django后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daily_eat_backend
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DB_HOST=database
      - DB_PORT=3306
      - DB_NAME=daily_eat_db
      - DB_USER=daily_eat_user
      - DB_PASSWORD=daily_eat_password
      - SECRET_KEY=your-secret-key-here-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - daily_eat_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vue.js前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daily_eat_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - daily_eat_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
  static_volume:
  media_volume:

networks:
  daily_eat_network:
    driver: bridge
